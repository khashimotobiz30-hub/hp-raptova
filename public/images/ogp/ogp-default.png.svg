<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#e5e5e5" stroke-width="2"/>

  <!-- Subtle dots -->
  <g opacity="0.2">
    <pattern id="ogp-dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1" fill="#cccccc"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#ogp-dots)"/>
  </g>

  <!-- Brand name -->
  <text x="80" y="240" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="8" fill="#aaaaaa">RAPTOVA</text>

  <!-- Tagline JA -->
  <text x="80" y="340" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="52" font-weight="500" fill="#0a0a0a">思考を、次の現実へ。</text>

  <!-- Tagline EN -->
  <text x="80" y="400" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="300" letter-spacing="4" fill="#8a8a8a">Evolve Your Reality.</text>

  <!-- Bottom rule -->
  <line x1="80" y1="490" x2="320" y2="490" stroke="#e5e5e5" stroke-width="1"/>
</svg>