<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Grid dots -->
  <g opacity="0.3">
    <pattern id="dots1" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="#bbbbbb"/>
    </pattern>
    <rect width="1200" height="675" fill="url(#dots1)"/>
  </g>

  <!-- Number -->
  <text x="80" y="160" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="3" fill="#aaaaaa">01</text>

  <!-- Title -->
  <text x="80" y="320" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="500" letter-spacing="4" fill="#0a0a0a">QUESTORIA</text>

  <!-- Subtitle -->
  <text x="80" y="365" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="2" fill="#8a8a8a">AI Diagnosis Application</text>

  <!-- Tags -->
  <text x="80" y="440" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="300" letter-spacing="1" fill="#bbbbbb">#AI Diagnosis  #Web App  #UX Design</text>

  <!-- Decorative line -->
  <line x1="80" y1="490" x2="360" y2="490" stroke="#e5e5e5" stroke-width="1"/>
</svg>